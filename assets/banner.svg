<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
  <title id="t">dotfiles</title>
  <desc id="d">Um Zsh rápido, bonito e reproduzível para macOS.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0f17"/>
      <stop offset="1" stop-color="#1b1430"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#bb9af7" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#bb9af7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.1" cy="1" r="0.5">
      <stop offset="0" stop-color="#7aa2f7" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7aa2f7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <clipPath id="frame"><rect width="1280" height="400" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="400" fill="url(#bg)"/>
    <rect width="1280" height="400" fill="url(#grid)"/>
    <rect width="1280" height="400" fill="url(#glow)"/>
    <rect width="1280" height="400" fill="url(#glow2)"/>
  </g>

  <!-- Texto -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="80" y="112" font-size="20" fill="#565f89">~/.local/share/chezmoi</text>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
    <text x="76" y="196" font-size="88" font-weight="800" fill="#e6e9f5" letter-spacing="-2">
      <tspan fill="#bb9af7">❯</tspan> dotfiles
    </text>
    <text x="80" y="246" font-size="26" fill="#a9b1d6">Um Zsh rápido, bonito e reproduzível para macOS.</text>
    <text x="80" y="280" font-size="20" fill="#565f89">Um comando para instalar. Zero segredos no Git.</text>
  </g>

