    <text x="416" y="336" text-anchor="middle" fill="#c9e4a8">chezmoi</text>
    <rect x="480" y="314" width="212" height="34" rx="17" fill="#e0af68" fill-opacity="0.14" stroke="#e0af68" stroke-opacity="0.45"/>
    <text x="586" y="336" text-anchor="middle" fill="#efd2a6">fzf · zoxide · atuin</text>
