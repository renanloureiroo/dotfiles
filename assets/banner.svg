      <text x="22" y="232"><tspan fill="#bb9af7">❯</tspan> <tspan fill="#9ece6a">git</tspan> <tspan fill="#c0caf5">st</tspan><tspan fill="#565f89">atus -sb</tspan></text>
    </g>
